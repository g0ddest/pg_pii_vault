# pg_pii_vault demo: PostgreSQL 18 with the extension + a HashiCorp Vault dev
# server. For evaluation only: the Vault dev server keeps everything in memory
# (restarting it destroys all keys, so all encrypted demo data becomes
# unreadable), has no TLS and uses a well-known root token.
#
#   docker compose up -d --build --wait
#   docker compose exec postgres psql -U postgres -d demo
#   docker compose down -v
name: pg-pii-vault-demo

services:
  vault:
    image: hashicorp/vault:2.1.1
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: demo-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mounts Transit, installs the least-privilege policies shipped in
  # vault/policies and writes a periodic token restricted to them for
  # PostgreSQL. In production a Vault Agent would maintain this token file.
  vault-init:
    image: hashicorp/vault:2.1.1
    # Root only to write into the fresh named volume.
    user: root
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: demo-root-token
    volumes:
      - ./vault/policies:/policies:ro
      - vault-token:/vault-token
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        vault secrets list | grep -q '^transit/' || vault secrets enable transit
        vault policy write pg-pii-vault /policies/pg-pii-vault.hcl
        vault policy write pg-pii-vault-shred /policies/pg-pii-vault-shred.hcl
        vault policy write pg-pii-vault-transit /policies/pg-pii-vault-transit.hcl
        vault token create -orphan -period=768h \
          -policy=pg-pii-vault -policy=pg-pii-vault-shred \
          -field=token > /vault-token/token.tmp
        chmod 0644 /vault-token/token.tmp
        mv /vault-token/token.tmp /vault-token/token
        echo "Vault ready: transit mounted, policies installed, token written"

  postgres:
    build:
      context: .
      args:
        INCLUDE_DEMO_INIT: "true"
    image: pg_pii_vault:demo
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
      PII_VAULT_URL: http://vault:8200
      # The dev Vault has no TLS. Never set this in production.
      PII_VAULT_ALLOW_INSECURE_HTTP: "on"
      PII_VAULT_TOKEN_FILE: /vault-token/token
    volumes:
      - vault-token:/vault-token:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"

volumes:
  vault-token:
  pgdata:
